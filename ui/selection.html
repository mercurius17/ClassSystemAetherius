<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleção de Classes - Aetherius SkyMP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/selection.css">
</head>
<body>
  <div class="selection-container" id="view-selection">
    <!-- Cabeçalho Principal (Apenas título e subtítulo, conforme referência) -->
    <header class="selection-header">
      <h1 class="selection-title">SELECIONE SUA CLASSE DE COMBATE</h1>
      <p class="selection-subtitle">Selecione apenas 1 Classe</p>
    </header>

    <!-- Grade de 3 Colunas dos Arquétipos -->
    <main class="archetypes-grid">
      <!-- 1. CONJURADORES -->
      <section class="archetype-column">
        <div class="archetype-header">
          <img src="assets/ui/conjuradores.svg" alt="Conjuradores" class="archetype-badge">
          <h2 class="archetype-title">CONJURADORES</h2>
        </div>
        <div class="classes-list" id="list-conjuradores">
          <!-- Cards injetados via JavaScript -->
        </div>
      </section>

      <!-- 2. GUERREIROS -->
      <section class="archetype-column">
        <div class="archetype-header">
          <img src="assets/ui/guerreiros.svg" alt="Guerreiros" class="archetype-badge">
          <h2 class="archetype-title">GUERREIROS</h2>
        </div>
        <div class="classes-list" id="list-guerreiros">
          <!-- Cards injetados via JavaScript -->
        </div>
      </section>

      <!-- 3. ESPECIALISTAS -->
      <section class="archetype-column">
        <div class="archetype-header">
          <img src="assets/ui/especialistas.svg" alt="Especialistas" class="archetype-badge">
          <h2 class="archetype-title">ESPECIALISTAS</h2>
        </div>
        <div class="classes-list" id="list-especialistas">
          <!-- Cards injetados via JavaScript -->
        </div>
      </section>
    </main>
  </div>

  <script src="js/embedded-data.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/prisma-bridge.js"></script>
  <script src="js/selection-controller.js"></script>
</body>
</html>
